<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Content Security Policy (CSP) -->
  <!-- CSP 以 HTTP header 設定於 _headers（目前 /* 為 Report-Only 觀察期；/*.html 為強制版，僅命中 /index.html 直連）。 -->
  <!-- 已驗證 Cloudflare Zaraz 不會在 CSP 注入 nonce，'unsafe-inline' 維持有效，下方 GA4 inline stub 不受影響。 -->

  <!-- Primary Meta Tags -->
  <!-- %SEO_TITLE% / %SEO_DESCRIPTION% / %SEO_ROBOTS% 由 vite.config.ts 的 seoHtmlPlugin 在 build/dev 時
       以 src/seo/defaults.ts 的常數替換，與執行期 SEO.tsx 寫入的值保持單一來源。 -->
  <title>%SEO_TITLE%</title>
  <meta name="title" content="%SEO_TITLE%" />
  <meta name="description" content="%SEO_DESCRIPTION%" />
  <meta name="author" content="Hsiung-Shao" />
  <meta name="robots" content="%SEO_ROBOTS%" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://multistreaming.org/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://multistreaming.org/" />
  <meta property="og:title" content="%SEO_TITLE%" />
  <meta property="og:description" content="%SEO_DESCRIPTION%" />
  <meta property="og:image" content="https://multistreaming.org/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="MultiStream Hub - watch multiple Twitch & YouTube streams at once" />
  <meta property="og:locale" content="zh_TW" />
  <meta property="og:locale:alternate" content="zh_CN" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:locale:alternate" content="ja_JP" />
  <meta property="og:locale:alternate" content="ko_KR" />
  <meta property="og:site_name" content="MultiStream Hub" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://multistreaming.org/" />
  <meta name="twitter:title" content="%SEO_TITLE%" />
  <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
  <meta name="twitter:image" content="https://multistreaming.org/og-image.png" />
  <meta name="twitter:image:alt" content="MultiStream Hub - watch multiple Twitch & YouTube streams at once" />

  <!-- Favicon：用輕量 192x192 logo.png（5KB，public/ 不經 hash），避免 1024x1024 icon.png(293KB)
       被當 favicon 以 high priority 載入而拖累首屏。大圖 icon.png 仍保留供 og:image / JSON-LD 社群分享使用。 -->
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="shortcut icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">

  <!-- Hreflang 已移除：本站多語系為 client-side 切換、沒有語言專屬 URL，
       全部 alternate 指向同一網址屬無效標記；待導入 URL-based locale 後再依各語言 URL 重加。 -->

  <!-- Structured Data (JSON-LD)
       softwareVersion / dateModified 由 seoHtmlPlugin 於 build 時注入（package.json version / 建置日期） -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MultiStream Hub",
        "alternateName": "多串流觀看工具",
        "url": "https://multistreaming.org/",
        "description": "免費的多平台直播串流觀看工具，支援同時觀看多個 Twitch 和 YouTube 直播，提供多種布局模式、聊天室整合、音量控制和收藏功能。",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web Browser",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "isAccessibleForFree": true,
        "creator": {
          "@type": "Person",
          "name": "Hsiung-Shao"
        },
        "featureList": [
          "多平台串流支援（Twitch、YouTube）",
          "多種布局模式",
          "聊天室整合",
          "音量控制",
          "收藏系統",
          "響應式設計",
          "多語言支援",
          "XSS 防護和 CSP 安全策略",
          "SEO 優化"
        ],
        "screenshot": "https://multistreaming.org/screenshots/canvas-hero.webp",
        "softwareVersion": "%APP_VERSION%",
        "datePublished": "2025-11-26",
        "dateModified": "%BUILD_DATE%",
        "inLanguage": ["zh-TW", "zh-CN", "en", "ja", "ko"]
      }
      </script>

  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MultiStream Hub",
        "url": "https://multistreaming.org/",
        "description": "免費的多平台直播串流觀看工具",
        "inLanguage": ["zh-TW", "zh-CN", "en", "ja", "ko"]
      }
      </script>

  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MultiStream Hub",
        "url": "https://multistreaming.org/",
        "logo": "https://multistreaming.org/icon.png",
        "sameAs": [
          "https://discord.gg/47kauArepY",
          "https://github.com/Hsiung-Shao"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Customer Service",
          "url": "https://forms.gle/AjG922YrXFbyAdBa6"
        }
      }
      </script>

  <!-- Twitch Player API 預連接優化（輕量級，不阻塞） -->
  <link rel="preconnect" href="https://player.twitch.tv" crossorigin>
  <link rel="dns-prefetch" href="https://player.twitch.tv">

  <!-- Google AdSense 腳本：改為「使用者接受 Cookie 後」才由 src/utils/adsense.ts 動態注入 -->
  <!-- （與 GA4/Umami 同意機制一致；未同意時不載入 → 不設第三方 cookie、不拖累首屏、符合 GDPR） -->

  <!-- GA4 boot stub：dataLayer 與 gtag 預先建立，正式初始化由 src/utils/analytics.ts 在環境檢查後接管 -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ window.dataLayer.push(arguments); }
    window.gtag = gtag;
    gtag('js', new Date());
  </script>

  <!-- GTM (GTM-WS5W6JWC) 已移除：codebase 沒有 dataLayer 業務事件、GTM 後台 3 個 tag 全屬 stream_heartbeat 系列，已被 native gtag.js 完整取代。CSP 仍允許 googletagmanager.com，將來如需重啟可直接還原此區塊。詳見 docs/ga4-gtm-investigation.md -->
</head>

<body>
  <!-- GTM noscript iframe 已移除（搭配 head 區塊 GTM script 一併移除） -->
  <div id="root"></div>

  <!-- Google AdSense 廣告單元（隱藏，用於審核檢測） -->
  <!-- 注意：隱藏的廣告單元不會觸發，實際廣告由 promotion.js 管理 -->
  <div style="display:none;position:absolute;left:-9999px;width:0;height:0;overflow:hidden;">
    <ins class="adsbygoogle" style="display:block;width:728px;height:90px;" data-ad-client="ca-pub-8415424787944153"
      data-ad-slot="2327980476" data-ad-format="auto" data-full-width-responsive="true"></ins>
  </div>
  <!-- 不在隱藏元素上觸發 AdSense，由 promotion.js 在可見時處理 -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
