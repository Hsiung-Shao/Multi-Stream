
  <!DOCTYPE html>
  <html lang="en">

    <body>
      <div id="root"></div>
      <!-- 載入 config.js 在 React 應用之前 -->
      <script src="/config.js"></script>

      <script defer src="/js/security.js"></script>

      <!-- 載入聊天室和音量控制腳本（依賴 utils.js 和 security.js） -->
      <script defer src="/js/chat.js"></script>
      <script defer src="/js/volume.js"></script>
      <!-- 載入控制面板腳本（包含 updateStreamOrderList 函數） -->
      <script defer src="/js/control-panel.js"></script>
